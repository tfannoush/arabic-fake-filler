<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #1e1e2f; color: #e0e0e0; margin: 0; text-align: right;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 24px; color: #ffffff; }
        .header p { margin: 5px 0 0 0; font-size: 13px; color: #bbbbbb; }
        .button-container { display: flex; flex-direction: column; gap: 10px; }
        button {
            padding: 12px 20px; border: none; border-radius: 25px;
            font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.3s ease;
        }
        .fill-btn { background: #4caf50; color: #ffffff; }
        .fill-btn:hover { background: #43a047; transform: translateY(-2px); }
        .clear-btn { background: #f44336; color: #ffffff; }
        .clear-btn:hover { background: #e53935; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎭 معبئ البيانات</h1>
        <p>تعبئة النماذج ببيانات وهمية لتسهيل الاختبار</p>
    </div>
    <div class="button-container">
        <button id="fillBtn" class="fill-btn">تعبئة جميع الحقول</button>
        <button id="clearBtn" class="clear-btn">مسح جميع الحقول</button>
    </div>
    <script src="popup.js"></script>
</body>
</html>
